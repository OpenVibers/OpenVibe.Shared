name: test
# The test job every OpenVibers Node service repository runs (roadmap Track Q): one definition,
# called from each repository's CI and pinned to a commit of this repo, so the steps, the Node
# version and the checks do not drift between 30 copies.
#
#   jobs:
#     test:
#       uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@<sha>
#       with:
#         contracts-service: wiki          # runs openvibe-contracts-check --service wiki --src server
#     security:
#       uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@<sha>
#
# Steps, in order:
#   checkout     `fetch-depth` commits (default 1; 0 for a check that needs the release tags)
#   packages     apt-get install of `apt-packages`, when set (e.g. ffmpeg for media tests)
#   install      `install` (default npm ci) with the npm cache (`package-manager: pnpm` sets up pnpm
#                and caches its store; `cache: false` for a repository without a lockfile)
#   syntax       node --check on every .js/.cjs/.mjs file under `syntax-dirs` (default: server
#                scripts), node_modules excluded; a directory that does not exist is skipped
#   test         `test` (default npm test)
#   contracts    openvibe-contracts-check --service <contracts-service> --src <dir> for each directory
#                in contracts-src, when contracts-service is set: the code's capability and event use
#                against the release
#   pin drift    scripts/pin-drift.js from OpenVibe.Shared main over the whole repository: a pin of
#                openvibe-contracts/-shared/-sdk/-publishing that is not a published tag, or more than one
#                minor behind the latest release, fails (roadmap WS-C task 5; `pin-drift: false` skips)
#   extra        `extra`, when set: any further commands, one per line (e.g. a budget check), with a
#                read-only GITHUB_TOKEN
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version (production runs Node 22).
        type: string
        default: 22.22.1
      working-directory:
        description: Directory holding package.json.
        type: string
        default: .
      apt-packages:
        description: Space-separated Ubuntu packages to install first ("" skips).
        type: string
        default: ''
      install:
        description: Install command.
        type: string
        default: npm ci --no-audit --no-fund
      test:
        description: Test command.
        type: string
        default: npm test
      syntax-dirs:
        description: Space-separated directories whose JavaScript must pass node --check ("" skips).
        type: string
        default: server scripts
      contracts-service:
        description: Service id for openvibe-contracts-check ("" skips the check).
        type: string
        default: ''
      contracts-src:
        description: Space-separated source directories openvibe-contracts-check scans.
        type: string
        default: server
      extra:
        description: Further commands after the tests, one per line ("" skips).
        type: string
        default: ''
      pin-drift:
        description: Fail on drifted openvibe-* library pins (OpenVibe.Shared scripts/pin-drift.js).
        type: boolean
        default: true
      package-manager:
        description: npm or pnpm (pnpm sets itself up from package.json's packageManager and caches the pnpm store).
        type: string
        default: npm
      cache:
        description: Cache the package manager's store (off for a repository with no lockfile).
        type: boolean
        default: true
      fetch-depth:
        description: Git history to check out (0 = everything, e.g. a compat check against the previous release tag).
        type: number
        default: 1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache && inputs.package-manager || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: packages
        if: ${{ inputs.apt-packages != '' }}
        env:
          PKGS: ${{ inputs.apt-packages }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PKGS
      - name: install
        run: ${{ inputs.install }}
      - name: syntax
        if: ${{ inputs.syntax-dirs != '' }}
        env:
          DIRS: ${{ inputs.syntax-dirs }}
        run: |
          n=0; failed=0
          for d in $DIRS; do
            [ -d "$d" ] || continue
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              node --check "$f" || { echo "::error file=$f::node --check failed"; failed=$((failed + 1)); }
            done < <(find "$d" -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path '*/node_modules/*' -print0)
          done
          echo "node --check: $n files, $failed failed"
          [ "$failed" -eq 0 ]
      - name: test
        run: ${{ inputs.test }}
      - name: contracts
        if: ${{ inputs.contracts-service != '' }}
        env:
          SERVICE: ${{ inputs.contracts-service }}
          SRC: ${{ inputs.contracts-src }}
        run: |
          args=(); for d in $SRC; do args+=(--src "$d"); done
          npx openvibe-contracts-check --service "$SERVICE" "${args[@]}"
      - name: pin drift
        if: ${{ inputs.pin-drift }}
        working-directory: .
        run: curl -fsSL https://raw.githubusercontent.com/OpenVibers/OpenVibe.Shared/main/scripts/pin-drift.js | node - "$GITHUB_WORKSPACE"
      - name: extra
        if: ${{ inputs.extra != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only (permissions: contents: read), for a step that asks GitHub
        run: ${{ inputs.extra }}
